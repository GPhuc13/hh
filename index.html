<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chemistry Quiz - Kết tinh</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #090e20, #172554, #312e81);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 850px;
    text-align: center;
}

.tag {
    color: #93c5fd;
    letter-spacing: 4px;
    font-size: 14px;
    font-weight: bold;
}

h1 {
    font-size: clamp(30px, 6vw, 48px);
    margin: 15px 0 5px;
}

.subtitle {
    color: #a5b4fc;
    margin-bottom: 35px;
    letter-spacing: 3px;
}

.card {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 22px;
    padding: 30px;
    backdrop-filter: blur(12px);
    box-shadow: 0 15px 50px #0006;
}

.top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
    color: #cbd5e1;
}

.timer {
    color: #facc15;
    font-size: 25px;
    font-weight: bold;
}

.progress {
    height: 7px;
    background: #334155;
    border-radius: 10px;
    margin-bottom: 30px;
    overflow: hidden;
}

.bar {
    height: 100%;
    width: 0%;
    background: #60a5fa;
    transition: width .3s;
}

.question {
    font-size: clamp(20px, 4vw, 27px);
    line-height: 1.5;
    margin-bottom: 28px;
}

.answers {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
}

.answer {
    padding: 18px;
    background: #26365c;
    border: 2px solid transparent;
    border-radius: 12px;
    color: white;
    font-size: 16px;
    cursor: pointer;
    transition: .2s;
    text-align: left;
}

.answer:hover:not(:disabled) {
    background: #3b5285;
    border-color: #93c5fd;
    transform: translateY(-2px);
}

.answer:disabled {
    cursor: default;
}

.correct {
    background: #166534 !important;
    border-color: #4ade80 !important;
}

.wrong {
    background: #991b1b !important;
    border-color: #f87171 !important;
}

.feedback {
    min-height: 35px;
    margin-top: 22px;
    font-weight: bold;
    font-size: 18px;
}

button.main {
    background: #6366f1;
    color: white;
    border: none;
    padding: 15px 35px;
    border-radius: 12px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 20px;
}

button.main:hover {
    background: #818cf8;
}

.hidden {
    display: none;
}

.result h2 {
    font-size: 35px;
    color: #facc15;
}

.result p {
    font-size: 20px;
}

@media(max-width:600px) {
    .answers {
        grid-template-columns: 1fr;
    }

    .card {
        padding: 20px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="tag">CHEMISTRY QUIZ</div>
    <h1>AI LÀ NHÀ HÓA HỌC?</h1>
    <div class="subtitle">PHƯƠNG PHÁP KẾT TINH</div>

    <div class="card" id="game">

        <div class="top">
            <span id="number">CÂU HỎI 1/3</span>
            <span class="timer" id="timer">15s</span>
        </div>

        <div class="progress">
            <div class="bar" id="bar"></div>
        </div>

        <div class="question" id="question"></div>

        <div class="answers" id="answers"></div>

        <div class="feedback" id="feedback"></div>

        <button class="main hidden" id="next"
            onclick="nextQuestion()">CÂU TIẾP THEO →</button>

    </div>

    <div class="card result hidden" id="result">
        <h2>HOÀN THÀNH!</h2>
        <p id="score"></p>
        <p id="comment"></p>
        <button class="main" onclick="restart()">CHƠI LẠI ↻</button>
    </div>

</div>

<script>

const questions = [
{
    q: "Tại sao cần lọc nóng dung dịch trong quá trình kết tinh?",
    a: [
        "A. Để làm dung dịch nguội nhanh hơn",
        "B. Để loại bỏ tạp chất không tan",
        "C. Để tăng độ tan của chất",
        "D. Để làm bay hơi dung môi"
    ],
    correct: 1,
    explain: "Lọc nóng giúp loại bỏ tạp chất không tan khi chất cần kết tinh vẫn còn hòa tan."
},
{
    q: "Dung môi dùng trong phương pháp kết tinh cần đáp ứng điều kiện nào?",
    a: [
        "A. Tan tốt khi nguội",
        "B. Không hòa tan chất ở mọi nhiệt độ",
        "C. Tan tốt khi nóng, ít tan khi nguội",
        "D. Phải phản ứng với chất cần tinh chế"
    ],
    correct: 2,
    explain: "Chất cần tinh chế phải tan tốt trong dung môi nóng và ít tan khi dung dịch nguội."
},
{
    q: "Cơ sở của phương pháp kết tinh là gì?",
    a: [
        "A. Sự khác nhau về nhiệt độ sôi",
        "B. Sự khác nhau về khối lượng riêng",
        "C. Sự khác nhau về độ tan theo nhiệt độ",
        "D. Sự khác nhau về màu sắc"
    ],
    correct: 2,
    explain: "Phương pháp kết tinh dựa vào sự khác nhau về độ tan của chất trong dung môi."
}
];

let current = 0;
let score = 0;
let time = 15;
let clock;
let locked = false;

function loadQuestion() {
    locked = false;
    time = 15;

    const q = questions[current];

    document.getElementById("number").textContent =
        `CÂU HỎI ${current + 1}/${questions.length}`;

    document.getElementById("question").textContent = q.q;
    document.getElementById("timer").textContent = "15s";
    document.getElementById("bar").style.width =
        `${(current / questions.length) * 100}%`;

    document.getElementById("feedback").textContent = "";
    document.getElementById("next").classList.add("hidden");

    const area = document.getElementById("answers");
    area.innerHTML = "";

    q.a.forEach((answer, index) => {
        const btn = document.createElement("button");
        btn.className = "answer";
        btn.textContent = answer;
        btn.onclick = () => chooseAnswer(index);
        area.appendChild(btn);
    });

    clearInterval(clock);
    clock = setInterval(countdown, 1000);
}

function countdown() {
    time--;
    document.getElementById("timer").textContent = time + "s";

    if (time <= 0) {
        clearInterval(clock);
        chooseAnswer(-1);
    }
}

function chooseAnswer(index) {
    if (locked) return;

    locked = true;
    clearInterval(clock);

    const q = questions[current];
    const buttons = document.querySelectorAll(".answer");
    const feedback = document.getElementById("feedback");

    buttons.forEach((btn, i) => {
        btn.disabled = true;

        if (i === q.correct) {
            btn.classList.add("correct");
        } else if (i === index) {
            btn.classList.add("wrong");
        }
    });

    if (index === q.correct) {
        score++;
        feedback.style.color = "#4ade80";
        feedback.textContent = "✓ CHÍNH XÁC! " + q.explain;
    } else {
        feedback.style.color = "#fca5a5";
        feedback.textContent =
            (index === -1 ? "HẾT GIỜ! " : "CHƯA CHÍNH XÁC! ")
            + q.explain;
    }

    document.getElementById("next").classList.remove("hidden");
    document.getElementById("next").textContent =
        current === questions.length - 1
        ? "XEM KẾT QUẢ →"
        : "CÂU TIẾP THEO →";
}

function nextQuestion() {
    current++;

    if (current < questions.length) {
        loadQuestion();
    } else {
        showResult();
    }
}

function showResult() {
    clearInterval(clock);

    document.getElementById("game").classList.add("hidden");
    document.getElementById("result").classList.remove("hidden");

    document.getElementById("score").textContent =
        `Bạn trả lời đúng ${score}/${questions.length} câu!`;

    let comment = "";

    if (score === 3) {
        comment = "Xuất sắc! Bạn là nhà hóa học thực thụ!";
    } else if (score === 2) {
        comment = "Rất tốt! Bạn đã nắm khá vững kiến thức.";
    } else {
        comment = "Hãy ôn tập thêm kiến thức về kết tinh nhé!";
    }

    document.getElementById("comment").textContent = comment;
}

function restart() {
    current = 0;
    score = 0;

    document.getElementById("result").classList.add("hidden");
    document.getElementById("game").classList.remove("hidden");

    loadQuestion();
}

loadQuestion();

</script>

</body>
</html>
